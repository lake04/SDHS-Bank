name: SDHS-Bank Build

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile bank.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SDHS-Bank
          path: dist/bank.exe
